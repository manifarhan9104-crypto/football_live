```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>جزئیات بازی | football_live</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080d12;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding-bottom: 90px;
    }

    /* HEADER */

    header {
      padding: 18px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      width: 43px;
      height: 43px;
      border: none;
      border-radius: 13px;
      background: #121a22;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .brand {
      text-align: center;
      flex: 1;
    }

    .brand h1 {
      font-size: 19px;
    }

    .brand p {
      color: #7d8b97;
      font-size: 11px;
      margin-top: 4px;
    }

    .header-space {
      width: 43px;
    }

    /* MATCH */

    .match-card {
      margin: 5px 16px 0;
      padding: 24px 18px;

      background:
        linear-gradient(145deg, #10251a, #10171d);

      border: 1px solid rgba(0, 210, 106, .35);
      border-radius: 25px;

      box-shadow: 0 15px 40px rgba(0, 0, 0, .2);
    }

    .live {
      width: max-content;
      margin: auto;

      background: rgba(255, 50, 50, .12);
      color: #ff5252;

      padding: 6px 13px;
      border-radius: 20px;

      font-size: 12px;
      font-weight: bold;
    }

    .league {
      text-align: center;
      color: #7d8b97;
      font-size: 12px;
      margin-top: 14px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;

      gap: 12px;
      margin-top: 25px;
    }

    .team {
      text-align: center;
    }

    .team-logo {
      width: 75px;
      height: 75px;

      margin: auto;

      border-radius: 50%;
      background: #1c2730;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      font-size: 35px;
    }

    .team-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .team-name {
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
    }

    .score {
      direction: ltr;
      text-align: center;

      font-size: 36px;
      font-weight: bold;
    }

    .minute {
      text-align: center;

      color: #00d26a;
      font-size: 14px;
      font-weight: bold;

      margin-top: 6px;
    }

    /* INFO */

    .info {
      margin-top: 22px;

      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 10px;
    }

    .info-item {
      background: #121a22;
      border-radius: 15px;
      padding: 14px;

      text-align: center;
    }

    .info-label {
      color: #7d8b97;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .info-value {
      font-size: 13px;
      font-weight: bold;
    }

    /* SECTION */

    .section {
      margin: 20px 16px 0;
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .event {
      background: #121a22;
      border-radius: 16px;
      padding: 14px;

      margin-bottom: 8px;

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .event-icon {
      font-size: 21px;
    }

    .event-text {
      font-size: 13px;
    }

    /* LOADING */

    .loading {
      text-align: center;
      color: #7d8b97;
      padding: 50px 20px;
    }

    .spinner {
      width: 32px;
      height: 32px;

      border: 3px solid #27333c;
      border-top-color: #00d26a;

      border-radius: 50%;

      margin: 0 auto 12px;

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ERROR */

    .error {
      margin: 20px 16px;

      background: #301719;
      color: #ff7777;

      border-radius: 15px;
      padding: 18px;

      text-align: center;
      font-size: 13px;
      line-height: 1.8;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;

      bottom: 0;
      left: 50%;

      transform: translateX(-50%);

      width: min(650px, 100%);
      height: 75px;

      background: #10171d;

      border-top: 1px solid #1d2730;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      z-index: 20;
    }

    .nav-item {
      border: none;
      background: transparent;

      color: #7d8b97;

      font-size: 11px;
      cursor: pointer;
    }

    .nav-item span {
      display: block;
      font-size: 22px;
      margin-bottom: 4px;
    }

    .nav-item.active {
      color: #00d26a;
    }

    @media(max-width:420px) {

      .team-logo {
        width: 62px;
        height: 62px;
      }

      .team-name {
        font-size: 12px;
      }

      .score {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>

    <button
      class="back-btn"
      onclick="window.location.href='index.html'">
      ←
    </button>

    <div class="brand">
      <h1>football_live</h1>
      <p>جزئیات بازی</p>
    </div>

    <div class="header-space"></div>

  </header>


  <div id="content">

    <div class="loading">

      <div class="spinner"></div>

      در حال دریافت اطلاعات بازی...

    </div>

  </div>

</div>


<nav class="bottom-nav">

  <button
    class="nav-item"
    onclick="window.location.href='index.html'">

    <span>🏠</span>
    خانه

  </button>


  <button
    class="nav-item active">

    <span>⚽</span>
    زنده

  </button>


  <button
    class="nav-item"
    onclick="window.location.href='index.html'">

    <span>📅</span>
    بازی‌ها

  </button>


  <button
    class="nav-item"
    onclick="window.location.href='index.html'">

    <span>📰</span>
    اخبار

  </button>

</nav>


<script>

async function loadMatch() {

  const content =
    document.getElementById("content");

  try {

    const response =
      await fetch("./api/matches.json");

    if (!response.ok) {
      throw new Error("matches.json پیدا نشد");
    }

    const data =
      await response.json();

    if (
      !data.success ||
      !data.match
    ) {
      throw new Error(
        "ساختار matches.json صحیح نیست"
      );
    }

    const match = data.match;


    const status =
      match.status || "UNKNOWN";

    const isLive =
      status === "LIVE";


    const homeLogo =
      match.homeLogo
      ? `<img src="${escapeHTML(match.homeLogo)}" alt="">`
      : "⚽";


    const awayLogo =
      match.awayLogo
      ? `<img src="${escapeHTML(match.awayLogo)}" alt="">`
      : "⚽";


    content.innerHTML = `

      <div class="match-card">

        ${
          isLive
          ? `<div class="live">🔴 LIVE</div>`
          : `<div class="live"
                    style="
                    color:#7d8b97;
                    background:#1c2730;">
                    ${escapeHTML(status)}
             </div>`
        }


        <div class="league">
          ${escapeHTML(match.league || "لیگ نامشخص")}
        </div>


        <div class="teams">


          <div class="team">

            <div class="team-logo">
              ${homeLogo}
            </div>

            <div class="team-name">
              ${escapeHTML(match.homeTeam)}
            </div>

          </div>


          <div>

            <div class="score">
              ${escapeHTML(match.homeScore)}
              -
              ${escapeHTML(match.awayScore)}
            </div>

            ${
              isLive
              ? `<div class="minute">
                   ${escapeHTML(match.minute || "0")}'
                 </div>`
              : `<div class="minute"
                         style="color:#7d8b97;">
                   ${escapeHTML(match.time || "-")}
                 </div>`
            }

          </div>


          <div class="team">

            <div class="team-logo">
              ${awayLogo}
            </div>

            <div class="team-name">
              ${escapeHTML(match.awayTeam)}
            </div>

          </div>


        </div>


        <div class="info">


          <div class="info-item">

            <div class="info-label">
              🏟️ ورزشگاه
            </div>

            <div class="info-value">
              ${escapeHTML(match.stadium || "-")}
            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              📅 تاریخ
            </div>

            <div class="info-value">
              ${escapeHTML(match.date || "-")}
            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              🕐 ساعت
            </div>

            <div class="info-value">
              ${escapeHTML(match.time || "-")}
            </div>

          </div>


          <div class="info-item">

            <div class="info-label">
              🏆 مسابقات
            </div>

            <div class="info-value">
              ${escapeHTML(match.league || "-")}
            </div>

          </div>


        </div>

      </div>


      <section class="section">

        <div class="section-title">
          📋 رویدادهای بازی
        </div>

        <div class="event">

          <div class="event-icon">
            ⚽
          </div>

          <div class="event-text">
            اطلاعات رویدادهای بازی به‌زودی اضافه می‌شود.
          </div>

        </div>

      </section>

    `;

  }

  catch(error) {

    console.error(error);

    content.innerHTML = `

      <div class="error">

        ❌ دریافت اطلاعات بازی با مشکل مواجه شد.

        <br>

        لطفاً مطمئن شو فایل زیر وجود دارد:

        <br>

        <b>api/matches.json</b>

      </div>

    `;

  }

}


/* جلوگیری از HTML Injection */

function escapeHTML(value) {

  if (
    value === undefined ||
    value === null
  ) {
    return "";
  }

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;

}


loadMatch();

</script>

</body>
</html>
```
