  <style>
    * {
      box-sizing: border-box;
      margin: 0;

    /* MATCH CARD */

<body>

<div class="app">

  <header>

    <button
      class="back-btn"
      onclick="goBack()">
      ←
    </button>

    <div class="brand">
      <h1>football_live</h1>
      <p>جزئیات بازی</p>
    </div>

    <div class="header-space"></div>

  </header>

  <main id="content">

    <div class="loading">

      <div class="spinner"></div>

      در حال دریافت اطلاعات بازی...

    </div>

  </main>

</div>


<nav class="bottom-nav">

  <button
    class="nav-item"
    onclick="goHome()">

    <span>🏠</span>
    خانه

  </button>

  <button
    class="nav-item active">

    <span>⚽</span>
    زنده

  </button>

  <button
    class="nav-item"
    onclick="goHome()">

    <span>📅</span>
    بازی‌ها

  </button>

  <button
    class="nav-item"
    onclick="goHome()">

    <span>📰</span>
    اخبار

  </button>

</nav>


<script>

const API_URL = "./api/matches.json";


/* گرفتن ID بازی از URL */

function getMatchId() {

  const params =
    new URLSearchParams(window.location.search);

  return params.get("id");
}


/* تبدیل وضعیت API به فارسی */

function getStatusInfo(status) {

  switch (status) {

    case "IN_PLAY":
      return {
        text: "🔴 LIVE",
        className: "live"
      };

    case "PAUSED":
      return {
        text: "⏸ نیمه",
        className: "live"
      };

    case "FINISHED":
      return {
        text: "پایان بازی",
        className: "finished"
      };

    case "TIMED":
      return {
        text: "بازی آینده",
        className: "upcoming"
      };

    case "SCHEDULED":
      return {
        text: "برنامه‌ریزی شده",
        className: "upcoming"
      };

    case "POSTPONED":
      return {
        text: "به تعویق افتاده",
        className: "postponed"
      };

    case "CANCELLED":
      return {
        text: "لغو شده",
        className: "postponed"
      };

    default:
      return {
        text: status || "نامشخص",
        className: "finished"
      };
  }
}


/* فرمت ساعت */

function formatTime(utcDate) {

  if (!utcDate) {
    return "-";
  }

  try {

    const date =
      new Date(utcDate);

    return date.toLocaleTimeString(
      "fa-IR",
      {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    );

  } catch {

    return "-";

  }
}


/* تبدیل تاریخ */

function formatDate(utcDate) {

  if (!utcDate) {
    return "-";
  }

  try {

    const date =
      new Date(utcDate);

    return date.toLocaleDateString(
      "fa-IR",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    );

  } catch {

    return "-";

  }
}


/* نمایش لوگو */

function teamLogo(url) {

  if (!url) {

    return `
      <div class="fallback-logo">
        ⚽
      </div>
    `;

  }

  return `
    <img
      src="${escapeHTML(url)}"
      alt="لوگوی تیم"
      onerror="this.style.display='none'; this.parentElement.innerHTML='⚽';"
    >
  `;

}


/* HTML Escape */

function escapeHTML(value) {

  if (
    value === undefined ||
    value === null
  ) {
    return "";
  }

  const div =
    document.createElement("div");

  div.textContent =
    String(value);

  return div.innerHTML;
}


/* نمایش خطا */

function showError(message) {

  const content =
    document.getElementById("content");

  content.innerHTML = `

    <div class="error">

      ❌ ${escapeHTML(message)}

      <br>

      <button onclick="loadMatch()">
        تلاش دوباره
      </button>

    </div>

  `;
}


/* دریافت بازی */

async function loadMatch() {

  const content =
    document.getElementById("content");

  const matchId =
    getMatchId();


  if (!matchId) {

    showError(
      "شناسه بازی در آدرس صفحه وجود ندارد."
    );

    return;
  }


  try {

    const response =
      await fetch(
        API_URL + "?t=" + Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "فایل matches.json پیدا نشد."
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !Array.isArray(data.matches)
    ) {

      throw new Error(
        "ساختار matches.json صحیح نیست."
      );

    }


    const match =
      data.matches.find(
        item =>
          String(item.id) === String(matchId)
      );


    if (!match) {

      showError(
        "این بازی در اطلاعات API پیدا نشد."
      );

      return;
    }


    renderMatch(match);


  } catch (error) {

    console.error(error);

    showError(
      "دریافت اطلاعات بازی با مشکل مواجه شد."
    );

  }

}


/* نمایش بازی */

function renderMatch(match) {

  const content =
    document.getElementById("content");


  const status =
    getStatusInfo(match.status);


  const homeTeam =
    match.homeTeam || {};


  const awayTeam =
    match.awayTeam || {};


  const score =
    match.score || {};


  const fullTime =
    score.fullTime || {};


  const homeScore =
    fullTime.home !== null &&
    fullTime.home !== undefined
      ? fullTime.home
      : "-";


  const awayScore =
    fullTime.away !== null &&
    fullTime.away !== undefined
      ? fullTime.away
      : "-";


  let minute = "";


  if (
    match.status === "IN_PLAY"
  ) {

    minute = "در حال برگزاری";

  } else if (
    match.status === "PAUSED"
  ) {

    minute = "نیمه";

  } else if (
    match.status === "FINISHED"
  ) {

    minute = "پایان";

  } else {

    minute =
      formatTime(match.utcDate);

  }


  content.innerHTML = `

    <div class="match-card">

      <div class="status ${status.className}">
        ${status.text}
      </div>


      <div class="league">

        🏆
        ${escapeHTML(
          match.competition?.name ||
          "لیگ نامشخص"
        )}

      </div>


      <div class="teams">


        <div class="team">

          <div class="team-logo">

            ${teamLogo(
              homeTeam.crest
            )}

          </div>


          <div class="team-name">

            ${escapeHTML(
              homeTeam.name ||
              "تیم میزبان"
            )}

          </div>

        </div>


        <div>

          <div class="score">

            ${escapeHTML(homeScore)}
            -
            ${escapeHTML(awayScore)}

          </div>


          <div class="minute">

            ${escapeHTML(minute)}

          </div>

        </div>


        <div class="team">

          <div class="team-logo">

            ${teamLogo(
              awayTeam.crest
            )}

          </div>


          <div class="team-name">

            ${escapeHTML(
              awayTeam.name ||
              "تیم مهمان"
            )}

          </div>

        </div>


      </div>


      <div class="info">


        <div class="info-item">

          <div class="info-label">
            🏆 مسابقات
          </div>

          <div class="info-value">

            ${escapeHTML(
              match.competition?.name ||
              "-"
            )}

          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            🌍 کشور
          </div>

          <div class="info-value">

            ${escapeHTML(
              match.area?.name ||
              "-"
            )}

          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            📅 تاریخ
          </div>

          <div class="info-value">

            ${formatDate(
              match.utcDate
            )}

          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            🕐 ساعت
          </div>

          <div class="info-value">

            ${formatTime(
              match.utcDate
            )}

          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            🔢 هفته
          </div>

          <div class="info-value">

            ${escapeHTML(
              match.matchday || "-"
            )}

          </div>

        </div>


        <div class="info-item">

          <div class="info-label">
            👨‍⚖️ داور
          </div>

          <div class="info-value">

            ${
              match.referees &&
              match.referees.length
                ? escapeHTML(
                    match.referees[0].name
                  )
                : "-"
            }

          </div>

        </div>


      </div>

    </div>


    <section class="section">

      <div class="section-title">
        📋 اطلاعات بازی
      </div>


      <div class="event">

        <div class="event-icon">
          ⚽
        </div>


        <div class="event-text">

          ${
            match.status === "IN_PLAY"
              ? "این بازی در حال برگزاری است."
              : match.status === "FINISHED"
              ? "این بازی به پایان رسیده است."
              : match.status === "TIMED"
              ? "این بازی هنوز شروع نشده است."
              : match.status === "POSTPONED"
              ? "این بازی به تعویق افتاده است."
              : "اطلاعات بیشتر بازی به‌زودی اضافه می‌شود."
          }

        </div>

      </div>


      ${
        match.status === "FINISHED"
        ? `

          <div class="event" style="margin-top:8px;">

            <div class="event-icon">
              🏁
            </div>

            <div class="event-text">

              نتیجه نهایی:

              <strong>
                ${escapeHTML(
                  homeTeam.name || ""
                )}
                ${escapeHTML(homeScore)}
                -
                ${escapeHTML(awayScore)}
                ${escapeHTML(
                  awayTeam.name || ""
                )}
              </strong>

            </div>

          </div>

        `
        : ""
      }


    </section>

  `;

}


/* دکمه برگشت */

function goBack() {

  if (
    document.referrer &&
    document.referrer.includes(
      window.location.hostname
    )
  ) {

    history.back();

  } else {

    goHome();

  }

}


/* خانه */

function goHome() {

  window.location.href =
    "index.html";

}


/* شروع */

loadMatch();


/*
  برای بازی‌های زنده،
  هر 30 ثانیه اطلاعات را دوباره می‌گیریم.
*/

setInterval(
  loadMatch,
  30000
);

</script>

</body>
</html>
```
