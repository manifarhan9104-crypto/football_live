<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اخبار | football_live</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080d12;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding-bottom: 90px;
    }

    header {
      padding: 18px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      width: 43px;
      height: 43px;
      border: none;
      border-radius: 13px;
      background: #121a22;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .brand {
      text-align: center;
      flex: 1;
    }

    .brand h1 {
      font-size: 19px;
    }

    .brand p {
      color: #7d8b97;
      font-size: 11px;
      margin-top: 4px;
    }

    .header-space {
      width: 43px;
    }

    .title {
      padding: 10px 16px 18px;
      font-size: 22px;
      font-weight: bold;
    }

    .news {
      margin: 0 16px;
      display: grid;
      gap: 12px;
    }

    .news-card {
      background: #121a22;
      border: 1px solid #1d2730;
      border-radius: 18px;
      padding: 16px;
    }

    .news-title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.8;
    }

    .news-meta {
      margin-top: 10px;
      color: #7d8b97;
      font-size: 11px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(650px, 100%);
      height: 75px;
      background: #10171d;
      border-top: 1px solid #1d2730;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 20;
    }

    .nav-item {
      border: none;
      background: transparent;
      color: #7d8b97;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-item span {
      display: block;
      font-size: 22px;
      margin-bottom: 4px;
    }

    .nav-item.active {
      color: #00d26a;
    }
  </style>
</head>

<body>

<div class="app">

  <header>

    <button
      class="back-btn"
      onclick="window.location.href='index.html'">
      ←
    </button>

    <div class="brand">
      <h1>football_live</h1>
      <p>اخبار فوتبال</p>
    </div>

    <div class="header-space"></div>

  </header>

  <div class="title">
    📰 آخرین اخبار
  </div>

  <div class="news">

    <div class="news-card">
      <div class="news-title">
        ⚽ به‌زودی آخرین اخبار فوتبال در این بخش نمایش داده می‌شود.
      </div>

      <div class="news-meta">
        football_live
      </div>
    </div>

    <div class="news-card">
      <div class="news-title">
        🔴 اخبار تیم‌ها و مسابقات به‌صورت خودکار اضافه خواهند شد.
      </div>

      <div class="news-meta">
        football_live
      </div>
    </div>

  </div>

</div>

<nav class="bottom-nav">

  <button
    class="nav-item"
    onclick="window.location.href='index.html'">
    <span>🏠</span>
    خانه
  </button>

  <button
    class="nav-item"
    onclick="window.location.href='index.html'">
    <span>⚽</span>
    زنده
  </button>

  <button
    class="nav-item"
    onclick="window.location.href='index.html'">
    <span>📅</span>
    بازی‌ها
  </button>

  <button
    class="nav-item active">
    <span>📰</span>
    اخبار
  </button>

</nav>

</body>
</html>
