<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>football_live</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #080d12;
  color: white;
  min-height: 100vh;
}

.app {
  max-width: 650px;
  margin: auto;
  padding-bottom: 95px;
}


/* =========================
   HEADER
========================= */

header {
  padding: 18px 16px;

  display: flex;

  align-items: center;

  justify-content: space-between;
}

.brand {
  display: flex;

  align-items: center;

  gap: 12px;
}

.logo {
  width: 50px;
  height: 50px;

  border-radius: 16px;

  background: #00d26a;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 27px;

  box-shadow:
    0 5px 20px
    rgba(0, 210, 106, .2);
}

.brand h1 {
  font-size: 21px;
}

.brand p {
  font-size: 11px;

  color: #7d8b97;

  margin-top: 4px;
}

.notification {
  width: 43px;
  height: 43px;

  border-radius: 13px;

  background: #121a22;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 20px;

  cursor: pointer;
}


/* =========================
   SECTION
========================= */

.section {
  padding: 0 16px;

  margin-top: 12px;
}

.section-title {
  font-size: 18px;

  font-weight: bold;

  margin-bottom: 13px;
}


/* =========================
   LIVE CARD
========================= */

.live-card {
  background:
    linear-gradient(
      145deg,
      #10251a,
      #10171d
    );

  border:
    1px solid
    rgba(0, 210, 106, .35);

  border-radius: 24px;

  padding: 20px;

  margin-bottom: 12px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.15);
}

.live-label {
  width: max-content;

  margin: auto;

  background:
    rgba(255,50,50,.12);

  color: #ff5252;

  padding: 6px 12px;

  border-radius: 20px;

  font-size: 12px;

  font-weight: bold;
}

.league {
  text-align: center;

  color: #7d8b97;

  font-size: 12px;

  margin-top: 14px;
}

.teams {
  display: grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items: center;

  gap: 12px;

  margin-top: 18px;
}

.team {
  text-align: center;
}

.team-logo {
  width: 58px;
  height: 58px;

  border-radius: 50%;

  background: #1c2730;

  display: flex;

  align-items: center;

  justify-content: center;

  margin: auto;

  font-size: 28px;
}

.team-logo-small {
  width: 42px;
  height: 42px;

  object-fit: contain;

  display: block;

  margin: 0 auto 6px;
}

.live-card .team-logo-small {
  width: 58px;
  height: 58px;
}

.team-name {
  font-size: 14px;

  font-weight: bold;

  margin-top: 8px;
}

.score {
  font-size: 30px;

  font-weight: bold;

  direction: ltr;

  white-space: nowrap;
}

.minute {
  text-align: center;

  color: #00d26a;

  font-weight: bold;

  font-size: 13px;

  margin-top: 5px;
}


/* =========================
   DETAILS BUTTON
========================= */

.details-btn {
  width: 100%;

  border: none;

  background: #00d26a;

  color: #06100b;

  font-weight: bold;

  padding: 14px;

  border-radius: 14px;

  margin-top: 20px;

  cursor: pointer;

  font-size: 14px;

  transition: .2s;
}

.details-btn:hover {
  transform: translateY(-2px);
}


/* =========================
   MATCH
========================= */

.match {
  background: #121a22;

  border-radius: 18px;

  padding: 16px;

  margin-bottom: 10px;

  cursor: pointer;

  transition: .2s;
}

.match:hover {
  transform: translateY(-2px);

  background: #162029;
}

.match-top {
  display: flex;

  justify-content: space-between;

  font-size: 11px;

  color: #7d8b97;
}

.status-live {
  color: #ff5252;

  font-weight: bold;
}

.status-finished {
  color: #7d8b97;
}

.status-upcoming {
  color: #00d26a;
}

.status-postponed {
  color: #ffb347;
}

.match-teams {
  display: grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items: center;

  text-align: center;

  margin-top: 14px;
}

.match-score {
  font-size: 19px;

  font-weight: bold;

  direction: ltr;

  white-space: nowrap;
}

.match-time {
  font-size: 11px;

  color: #7d8b97;

  margin-top: 5px;
}

.team-name-small {
  font-size: 12px;

  font-weight: bold;
}


/* =========================
   EMPTY
========================= */

.empty {
  background: #121a22;

  border-radius: 18px;

  padding: 25px;

  text-align: center;

  color: #7d8b97;

  font-size: 13px;

  margin-bottom: 10px;
}


/* =========================
   NEWS
========================= */

.news {
  background: #121a22;

  border-radius: 18px;

  padding: 15px;

  margin-bottom: 10px;

  display: flex;

  gap: 13px;

  cursor: pointer;

  transition: .2s;
}

.news:hover {
  transform: translateY(-2px);

  background: #162029;
}

.news-icon {
  width: 65px;
  height: 65px;

  border-radius: 14px;

  background: #1c2730;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 28px;

  flex-shrink: 0;
}

.news-content {
  flex: 1;
}

.news-title {
  font-size: 14px;

  font-weight: bold;

  line-height: 1.6;
}

.news-description {
  font-size: 11px;

  color: #7d8b97;

  line-height: 1.7;

  margin-top: 5px;
}

.news-category {
  display: inline-block;

  font-size: 10px;

  color: #00d26a;

  background:
    rgba(0,210,106,.1);

  padding: 4px 7px;

  border-radius: 7px;

  margin-top: 7px;
}


/* =========================
   LOADING
========================= */

.loading {
  text-align: center;

  color: #7d8b97;

  padding: 25px;
}

.loading-spinner {
  width: 28px;
  height: 28px;

  border: 3px solid #27333c;

  border-top-color: #00d26a;

  border-radius: 50%;

  margin: 0 auto 10px;

  animation:
    spin .8s linear infinite;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================
   ERROR
========================= */

.error {
  background: #301719;

  color: #ff7777;

  padding: 15px;

  border-radius: 14px;

  font-size: 12px;

  text-align: center;

  margin-bottom: 10px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
  position: fixed;

  bottom: 0;

  left: 50%;

  transform:
    translateX(-50%);

  width:
    min(650px, 100%);

  height: 75px;

  background: #10171d;

  border-top:
    1px solid #1d2730;

  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  z-index: 20;
}

.nav-item {
  border: none;

  background: transparent;

  color: #7d8b97;

  cursor: pointer;

  font-size: 11px;
}

.nav-item span {
  display: block;

  font-size: 22px;

  margin-bottom: 4px;
}

.nav-item.active {
  color: #00d26a;
}


/* =========================
   MOBILE
========================= */

@media(max-width:420px) {

  .brand h1 {
    font-size: 18px;
  }

  .score {
    font-size: 27px;
  }

  .team-name {
    font-size: 12px;
  }

}

</style>

</head>


<body>


<div class="app">


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="brand">

    <div class="logo">
      ⚽
    </div>

    <div>

      <h1>
        football_live
      </h1>

      <p>
        نتایج زنده فوتبال
      </p>

    </div>

  </div>


  <div
    class="notification"
    onclick="showNotification()">

    🔔

  </div>

</header>



<!-- =========================
     LIVE MATCHES
========================= -->

<section class="section">

  <div class="section-title">
    🔴 بازی‌های زنده
  </div>


  <div id="liveMatches">

    <div class="loading">

      <div class="loading-spinner"></div>

      در حال دریافت بازی‌های زنده...

    </div>

  </div>

</section>



<!-- =========================
     TODAY MATCHES
========================= -->

<section class="section">

  <div class="section-title">
    📅 بازی‌های امروز
  </div>


  <div id="todayMatches">

    <div class="loading">

      <div class="loading-spinner"></div>

      در حال دریافت بازی‌های امروز...

    </div>

  </div>

</section>



<!-- =========================
     NEWS
========================= -->

<section class="section">

  <div class="section-title">
    📰 آخرین اخبار
  </div>


  <div id="newsContainer">

    <div class="loading">

      <div class="loading-spinner"></div>

      در حال دریافت اخبار...

    </div>

  </div>

</section>


</div>



<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">


  <button
    class="nav-item active"
    onclick="goHome()">

    <span>
      🏠
    </span>

    خانه

  </button>


  <button
    class="nav-item"
    onclick="scrollToLive()">

    <span>
      ⚽
    </span>

    زنده

  </button>


  <button
    class="nav-item"
    onclick="showMatches()">

    <span>
      📅
    </span>

    بازی‌ها

  </button>


  <button
    class="nav-item"
    onclick="scrollToNews()">

    <span>
      📰
    </span>

    اخبار

  </button>


</nav>



<script>


/* =====================================================
   API CONFIG
===================================================== */


/*
  اگر API مسابقاتت مسیر دیگری دارد،
  فقط مقدار زیر را تغییر بده.

  مثال:

  const MATCHES_API =
    "https://football-live-api-7fse.onrender.com/api/matches";
*/

const MATCHES_API =
  "/api/matches";


/*
  مسیر اخبار
*/

const NEWS_API =
  "./api/news.json";



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  if (
    value === undefined ||
    value === null
  ) {

    return "";

  }


  const div =
    document.createElement("div");


  div.textContent =
    String(value);


  return div.innerHTML;

}



/* =====================================================
   STATUS TEXT
===================================================== */

function getStatusText(status) {

  switch(status) {

    case "IN_PLAY":

      return "🔴 LIVE";


    case "PAUSED":

      return "⏸ بین دو نیمه";


    case "FINISHED":

      return "پایان یافته";


    case "TIMED":

      return "آینده";


    case "SCHEDULED":

      return "آینده";


    case "POSTPONED":

      return "به تعویق افتاده";


    case "SUSPENDED":

      return "معلق";


    case "CANCELLED":

      return "لغو شده";


    default:

      return "نامشخص";

  }

}



/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status) {

  if (
    status === "IN_PLAY" ||
    status === "PAUSED"
  ) {

    return "status-live";

  }


  if (status === "FINISHED") {

    return "status-finished";

  }


  if (status === "POSTPONED" ||
      status === "SUSPENDED" ||
      status === "CANCELLED") {

    return "status-postponed";

  }


  return "status-upcoming";

}



/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(utcDate) {

  if (!utcDate) {

    return "--:--";

  }


  const date =
    new Date(utcDate);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "--:--";

  }


  return date.toLocaleTimeString(
    "fa-IR",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}



/* =====================================================
   GET SCORE
===================================================== */

function getScore(match) {

  const score =
    match.score || {};


  const fullTime =
    score.fullTime || {};


  const home =
    fullTime.home;


  const away =
    fullTime.away;


  if (
    home !== null &&
    home !== undefined &&
    away !== null &&
    away !== undefined
  ) {

    return `${home} - ${away}`;

  }


  return "-";

}



/* =====================================================
   GET LIVE MINUTE
===================================================== */

function getMinute(match) {

  if (
    match.status === "PAUSED"
  ) {

    return "⏸ بین دو نیمه";

  }


  if (
    match.status !== "IN_PLAY"
  ) {

    return "";

  }


  if (
    match.minute !== undefined &&
    match.minute !== null
  ) {

    return `${match.minute}'`;

  }


  return "LIVE";

}



/* =====================================================
   TEAM LOGO
===================================================== */

function getTeamLogo(team, live = false) {

  const name =
    team?.name || "تیم";


  const crest =
    team?.crest;


  if (crest) {

    return `

      <img

        class="${
          live
          ? "team-logo-small live-logo"
          : "team-logo-small"
        }"

        src="${escapeHTML(crest)}"

        alt="${escapeHTML(name)}"

        onerror="
          this.onerror=null;
          this.style.display='none';
        "

      >

    `;

  }


  return `

    <div class="team-logo">
      ⚽
    </div>

  `;

}



/* =====================================================
   CREATE LIVE CARD
===================================================== */

function createLiveMatch(match) {

  const home =
    match.homeTeam?.name ||
    "تیم میزبان";


  const away =
    match.awayTeam?.name ||
    "تیم مهمان";


  const league =
    match.competition?.name ||
    "مسابقات فوتبال";


  const score =
    getScore(match);


  const minute =
    getMinute(match);


  return `

    <div class="live-card">


      <div class="live-label">

        🔴 LIVE

      </div>


      <div class="league">

        ${escapeHTML(league)}

      </div>


      <div class="teams">


        <!-- HOME -->

        <div class="team">

          ${getTeamLogo(
            match.homeTeam,
            true
          )}


          <div class="team-name">

            ${escapeHTML(home)}

          </div>

        </div>



        <!-- SCORE -->

        <div>

          <div class="score">

            ${escapeHTML(score)}

          </div>


          <div class="minute">

            ${escapeHTML(minute)}

          </div>

        </div>



        <!-- AWAY -->

        <div class="team">

          ${getTeamLogo(
            match.awayTeam,
            true
          )}


          <div class="team-name">

            ${escapeHTML(away)}

          </div>

        </div>


      </div>



      <button

        class="details-btn"

        onclick="
          openMatch(${Number(match.id)})
        "

      >

        مشاهده جزئیات بازی

      </button>


    </div>

  `;

}



/* =====================================================
   CREATE TODAY MATCH
===================================================== */

function createTodayMatch(match) {

  const home =
    match.homeTeam?.name ||
    "میزبان";


  const away =
    match.awayTeam?.name ||
    "مهمان";


  const league =
    match.competition?.name ||
    "فوتبال";


  const status =
    match.status ||
    "";


  const statusText =
    getStatusText(status);


  const statusClass =
    getStatusClass(status);


  return `

    <div

      class="match"

      onclick="
        openMatch(${Number(match.id)})
      "

    >


      <div class="match-top">


        <span>

          ${escapeHTML(league)}

        </span>


        <span class="${statusClass}">

          ${escapeHTML(statusText)}

        </span>


      </div>



      <div class="match-teams">


        <!-- HOME -->

        <div>

          ${getTeamLogo(
            match.homeTeam
          )}


          <div class="team-name-small">

            ${escapeHTML(home)}

          </div>

        </div>



        <!-- SCORE -->

        <div>

          <div class="match-score">

            ${escapeHTML(
              getScore(match)
            )}

          </div>


          <div class="match-time">

            ${formatTime(
              match.utcDate
            )}

          </div>

        </div>



        <!-- AWAY -->

        <div>

          ${getTeamLogo(
            match.awayTeam
          )}


          <div class="team-name-small">

            ${escapeHTML(away)}

          </div>

        </div>


      </div>


    </div>

  `;

}



/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches() {

  const liveContainer =
    document.getElementById(
      "liveMatches"
    );


  const todayContainer =
    document.getElementById(
      "todayMatches"
    );


  try {


    liveContainer.innerHTML = `

      <div class="loading">

        <div class="loading-spinner"></div>

        در حال بروزرسانی...

      </div>

    `;


    const response =
      await fetch(
        MATCHES_API,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    console.log(
      "Football API:",
      data
    );


    /*
      API باید به شکل زیر باشد:

      {
        "matches": [...]
      }
    */


    if (
      !data ||
      !Array.isArray(
        data.matches
      )
    ) {

      throw new Error(
        "ساختار API مسابقات صحیح نیست"
      );

    }


    const matches =
      data.matches;


    /* =================================
       LIVE
    ================================= */

    const liveMatches =
      matches.filter(
        match =>

          match.status ===
            "IN_PLAY"

          ||

          match.status ===
            "PAUSED"
      );


    if (
      liveMatches.length === 0
    ) {

      liveContainer.innerHTML = `

        <div class="empty">

          ⚽ در حال حاضر
          بازی زنده‌ای وجود ندارد.

        </div>

      `;

    }

    else {

      liveContainer.innerHTML =
        liveMatches
          .map(
            createLiveMatch
          )
          .join("");

    }



    /* =================================
       TODAY
    ================================= */

    if (
      matches.length === 0
    ) {

      todayContainer.innerHTML = `

        <div class="empty">

          📅 بازی‌ای برای امروز
          پیدا نشد.

        </div>

      `;

    }

    else {

      todayContainer.innerHTML =
        matches
          .map(
            createTodayMatch
          )
          .join("");

    }


  }

  catch(error) {


    console.error(
      "Matches Error:",
      error
    );


    liveContainer.innerHTML = `

      <div class="error">

        ❌ دریافت بازی‌ها ناموفق بود.

        <br><br>

        مسیر API:

        <br>

        ${escapeHTML(
          MATCHES_API
        )}

        <br><br>

        خطا:

        ${escapeHTML(
          error.message
        )}

      </div>

    `;


    todayContainer.innerHTML = `

      <div class="empty">

        بازی‌ها در دسترس نیستند.

      </div>

    `;

  }

}



/* =====================================================
   LOAD NEWS
===================================================== */

async function loadNews() {


  const container =
    document.getElementById(
      "newsContainer"
    );


  try {


    const response =
      await fetch(
        NEWS_API,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "news.json پیدا نشد"
      );

    }


    const data =
      await response.json();


    if (
      !data.success ||
      !Array.isArray(
        data.news
      )
    ) {

      throw new Error(
        "ساختار news.json صحیح نیست"
      );

    }


    container.innerHTML = "";


    if (
      data.news.length === 0
    ) {

      container.innerHTML = `

        <div class="empty">

          📰 خبری موجود نیست.

        </div>

      `;

      return;

    }


    data.news.forEach(
      news => {


        const item =
          document.createElement(
            "div"
          );


        item.className =
          "news";


        item.innerHTML = `

          <div class="news-icon">

            📰

          </div>


          <div class="news-content">


            <div class="news-title">

              ${escapeHTML(
                news.title
              )}

            </div>


            <div class="news-description">

              ${escapeHTML(
                news.description
              )}

            </div>


            <div class="news-category">

              ${escapeHTML(
                news.category
              )}

            </div>


          </div>

        `;


        container.appendChild(
          item
        );


      }
    );


  }

  catch(error) {


    console.error(
      "News Error:",
      error
    );


    container.innerHTML = `

      <div class="error">

        ❌ دریافت اخبار با مشکل مواجه شد.

        <br><br>

        مسیر:

        ${escapeHTML(
          NEWS_API
        )}

      </div>

    `;

  }

}



/* =====================================================
   OPEN MATCH
===================================================== */

function openMatch(id) {

  if (
    !id ||
    Number.isNaN(
      Number(id)
    )
  ) {

    return;

  }


  window.location.href =
    `match.html?id=${encodeURIComponent(id)}`;

}



/* =====================================================
   NOTIFICATION
===================================================== */

function showNotification() {

  alert(
    "🔔 اعلان‌های football_live به‌زودی فعال می‌شوند."
  );

}



/* =====================================================
   HOME
===================================================== */

function goHome() {

  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}



/* =====================================================
   LIVE BUTTON
===================================================== */

function scrollToLive() {

  const live =
    document.getElementById(
      "liveMatches"
    );


  if (live) {

    live.scrollIntoView({

      behavior: "smooth",

      block: "start"

    });

  }

}



/* =====================================================
   MATCHES BUTTON

function showMatches() {

  const matches =
    document.getElementById(
      "todayMatches"
    );


  if (matches) {

    matches.scrollIntoView({

      behavior: "smooth",

      block: "start"

    });

  }

}

function scrollToNews() {

  const news =
    document.getElementById(
      "newsContainer"
    );


  if (news) {

    news.scrollIntoView({

      behavior: "smooth",

      block: "start"

    });

  }

}
