<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>football_live</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #080d12;
  color: white;
  min-height: 100vh;
}

.app {
  max-width: 650px;
  margin: auto;
  padding-bottom: 95px;
}

/* HEADER */

header {
  padding: 18px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  background: #00d26a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
  box-shadow: 0 5px 20px rgba(0, 210, 106, .2);
}

.brand h1 {
  font-size: 21px;
}

.brand p {
  font-size: 11px;
  color: #7d8b97;
  margin-top: 4px;
}

.notification {
  width: 43px;
  height: 43px;
  border-radius: 13px;
  background: #121a22;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
}

/* SECTION */

.section {
  padding: 0 16px;
  margin-top: 18px;
}

.section-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 13px;
}

/* LIVE */

.live-card {
  background: linear-gradient(
    145deg,
    #10251a,
    #10171d
  );

  border: 1px solid rgba(0, 210, 106, .35);
  border-radius: 24px;
  padding: 20px;
}

.live-label {
  width: max-content;
  margin: auto;
  background: rgba(255,50,50,.12);
  color: #ff5252;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.league {
  text-align: center;
  color: #7d8b97;
  font-size: 12px;
  margin-top: 14px;
}

.teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  margin-top: 18px;
}

.team {
  text-align: center;
}

.team-logo {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #1c2730;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto;
  overflow: hidden;
}

.team-logo img {
  width: 48px;
  height: 48px;
  object-fit: contain;
}

.team-name {
  font-size: 14px;
  font-weight: bold;
  margin-top: 8px;
}

.score {
  font-size: 30px;
  font-weight: bold;
  direction: ltr;
}

.minute {
  text-align: center;
  color: #00d26a;
  font-weight: bold;
  font-size: 13px;
  margin-top: 5px;
}

.details-btn {
  width: 100%;
  border: none;
  background: #00d26a;
  color: #06100b;
  font-weight: bold;
  padding: 14px;
  border-radius: 14px;
  margin-top: 20px;
  cursor: pointer;
  font-size: 14px;
}

/* MATCHES */

.match {
  background: #121a22;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: .2s;
}

.match:hover {
  transform: translateY(-2px);
  background: #162029;
}

.match-top {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: #7d8b97;
}

.status {
  color: #00d26a;
}

.status.finished {
  color: #7d8b97;
}

.status.upcoming {
  color: #ffc107;
}

.match-teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  text-align: center;
  margin-top: 14px;
}

.match-team {
  font-size: 13px;
  font-weight: bold;
}

.match-team img {
  width: 35px;
  height: 35px;
  object-fit: contain;
  display: block;
  margin: 0 auto 7px;
}

.match-score {
  font-size: 19px;
  font-weight: bold;
  direction: ltr;
}

.match-time {
  font-size: 11px;
  color: #7d8b97;
  margin-top: 5px;
}

/* NEWS */

.news {
  background: #121a22;
  border-radius: 18px;
  padding: 15px;
  margin-bottom: 10px;
  display: flex;
  gap: 13px;
  cursor: pointer;
  transition: .2s;
}

.news:hover {
  transform: translateY(-2px);
  background: #162029;
}

.news-icon {
  width: 65px;
  height: 65px;
  border-radius: 14px;
  background: #1c2730;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
}

.news-content {
  flex: 1;
}

.news-title {
  font-size: 14px;
  font-weight: bold;
  line-height: 1.6;
}

.news-description {
  font-size: 11px;
  color: #7d8b97;
  line-height: 1.7;
  margin-top: 5px;
}

.news-category {
  display: inline-block;
  font-size: 10px;
  color: #00d26a;
  background: rgba(0,210,106,.1);
  padding: 4px 7px;
  border-radius: 7px;
  margin-top: 7px;
}

/* LOADING */

.loading {
  text-align: center;
  color: #7d8b97;
  padding: 25px;
}

.loading-spinner {
  width: 28px;
  height: 28px;
  border: 3px solid #27333c;
  border-top-color: #00d26a;
  border-radius: 50%;
  margin: 0 auto 10px;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ERROR */

.error {
  background: #301719;
  color: #ff7777;
  padding: 15px;
  border-radius: 14px;
  font-size: 12px;
  text-align: center;
}

/* EMPTY */

.empty {
  background: #121a22;
  color: #7d8b97;
  padding: 25px;
  border-radius: 18px;
  text-align: center;
  font-size: 13px;
}

/* BOTTOM NAV */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(650px, 100%);
  height: 75px;
  background: #10171d;
  border-top: 1px solid #1d2730;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  z-index: 20;
}

.nav-item {
  border: none;
  background: transparent;
  color: #7d8b97;
  cursor: pointer;
  font-size: 11px;
}

.nav-item span {
  display: block;
  font-size: 22px;
  margin-bottom: 4px;
}

.nav-item.active {
  color: #00d26a;
}

/* MOBILE */

@media(max-width:420px) {

  .brand h1 {
    font-size: 18px;
  }

  .score {
    font-size: 27px;
  }

  .team-name {
    font-size: 12px;
  }

}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->

<header>

  <div class="brand">

    <div class="logo">
      ⚽
    </div>

    <div>

      <h1>football_live</h1>

      <p>
        نتایج زنده فوتبال
      </p>

    </div>

  </div>

  <div
    class="notification"
    onclick="showNotification()">

    🔔

  </div>

</header>


<!-- LIVE MATCH -->

<section class="section">

  <div class="section-title">
    🔴 بازی‌های زنده
  </div>

  <div id="liveContainer">

    <div class="loading">

      <div class="loading-spinner"></div>

      در حال دریافت بازی‌های زنده...

    </div>

  </div>

</section>


<!-- TODAY MATCHES -->

<section
  class="section"
  id="matchesSection">

  <div class="section-title">
    📅 بازی‌های امروز
  </div>

  <div id="matchesContainer">

    <div class="loading">

      <div class="loading-spinner"></div>

      در حال دریافت مسابقات...

    </div>

  </div>

</section>


<!-- NEWS -->

<section
  class="section"
  id="newsSection">

  <div class="section-title">
    📰 آخرین اخبار
  </div>

  <div id="newsContainer">

    <div class="loading">

      <div class="loading-spinner"></div>

      در حال دریافت اخبار...

    </div>

  </div>

</section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    class="nav-item active"
    onclick="goHome()">

    <span>🏠</span>

    خانه

  </button>


  <button
    class="nav-item"
    onclick="scrollToLive()">

    <span>⚽</span>

    زنده

  </button>


  <button
    class="nav-item"
    onclick="showMatches()">

    <span>📅</span>

    بازی‌ها

  </button>


  <button
    class="nav-item"
    onclick="scrollToNews()">

    <span>📰</span>

    اخبار

  </button>

</nav>


<script>

/* =========================================
   GLOBAL DATA
========================================= */

let matchesData = [];


/* =========================================
   LOAD MATCHES
========================================= */

async function loadMatches() {

  const liveContainer =
    document.getElementById(
      "liveContainer"
    );

  const matchesContainer =
    document.getElementById(
      "matchesContainer"
    );

  try {

    const response =
      await fetch(
        "./api/matches.json?time=" +
        Date.now()
      );

    if (!response.ok) {

      throw new Error(
        "matches.json پیدا نشد"
      );

    }

    const data =
      await response.json();

    if (
      !data.matches ||
      !Array.isArray(data.matches)
    ) {

      throw new Error(
        "ساختار matches.json صحیح نیست"
      );

    }

    matchesData =
      data.matches;


    renderLiveMatches(
      matchesData,
      liveContainer
    );


    renderTodayMatches(
      matchesData,
      matchesContainer
    );


  } catch(error) {

    console.error(
      "Matches Error:",
      error
    );

    liveContainer.innerHTML = `

      <div class="error">

        ❌ دریافت مسابقات با مشکل مواجه شد.

        <br><br>

        مسیر:

        api/matches.json

      </div>

    `;


    matchesContainer.innerHTML = "";

  }

}


/* =========================================
   LIVE MATCHES
========================================= */

function renderLiveMatches(
  matches,
  container
) {

  const liveMatches =
    matches.filter(
      match => {

        return (
          match.status === "IN_PLAY" ||
          match.status === "PAUSED"
        );

      }
    );


  if (
    liveMatches.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        🟢 در حال حاضر بازی زنده‌ای پیدا نشد.

      </div>

    `;

    return;

  }


  const match =
    liveMatches[0];


  const homeScore =
    match.score?.fullTime?.home ??
    0;

  const awayScore =
    match.score?.fullTime?.away ??
    0;


  const homeName =
    match.homeTeam?.shortName ||
    match.homeTeam?.name ||
    "تیم میزبان";


  const awayName =
    match.awayTeam?.shortName ||
    match.awayTeam?.name ||
    "تیم مهمان";


  const homeLogo =
    match.homeTeam?.crest ||
    "";


  const awayLogo =
    match.awayTeam?.crest ||
    "";


  const league =
    match.competition?.name ||
    "مسابقه فوتبال";


  const minute =
    getMatchMinute(match);


  container.innerHTML = `

    <div class="live-card">

      <div class="live-label">

        🔴 LIVE

      </div>


      <div class="league">

        ${escapeHTML(league)}

      </div>


      <div class="teams">


        <div class="team">

          <div class="team-logo">

            ${
              homeLogo
              ?
              `<img
                src="${escapeHTML(homeLogo)}"
                alt=""
                onerror="this.style.display='none'"
              >`
              :
              "⚽"
            }

          </div>

          <div class="team-name">

            ${escapeHTML(homeName)}

          </div>

        </div>


        <div>

          <div class="score">

            ${homeScore} - ${awayScore}

          </div>

          <div class="minute">

            ${escapeHTML(minute)}

          </div>

        </div>


        <div class="team">

          <div class="team-logo">

            ${
              awayLogo
              ?
              `<img
                src="${escapeHTML(awayLogo)}"
                alt=""
                onerror="this.style.display='none'"
              >`
              :
              "⚽"
            }

          </div>

          <div class="team-name">

            ${escapeHTML(awayName)}

          </div>

        </div>


      </div>


      <button
        class="details-btn"
        onclick="openMatch('${match.id}')">

        مشاهده جزئیات بازی

      </button>

    </div>

  `;

}


/* =========================================
   TODAY MATCHES
========================================= */

function renderTodayMatches(
  matches,
  container
) {

  if (
    matches.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        مسابقه‌ای برای امروز پیدا نشد.

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  matches.forEach(
    match => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "match";


      const homeName =
        match.homeTeam?.shortName ||
        match.homeTeam?.name ||
        "میزبان";


      const awayName =
        match.awayTeam?.shortName ||
        match.awayTeam?.name ||
        "مهمان";


      const homeLogo =
        match.homeTeam?.crest ||
        "";


      const awayLogo =
        match.awayTeam?.crest ||
        "";


      const competition =
        match.competition?.name ||
        "فوتبال";


      const status =
        match.status ||
        "";


      const homeScore =
        match.score?.fullTime?.home;


      const awayScore =
        match.score?.fullTime?.away;


      let scoreText =
        "-";


      if (
        homeScore !== null &&
        homeScore !== undefined &&
        awayScore !== null &&
        awayScore !== undefined
      ) {

        scoreText =
          `${homeScore} - ${awayScore}`;

      }


      const time =
        formatTime(
          match.utcDate
        );


      const statusInfo =
        getStatusInfo(
          status
        );


      item.innerHTML = `

        <div class="match-top">

          <span>

            ${escapeHTML(
              competition
            )}

          </span>

          <span
            class="${statusInfo.className}">

            ${statusInfo.text}

          </span>

        </div>


        <div class="match-teams">


          <div class="match-team">

            ${
              homeLogo
              ?
              `<img
                src="${escapeHTML(homeLogo)}"
                alt=""
                onerror="this.style.display='none'"
              >`
              :
              "⚽"
            }

            ${escapeHTML(homeName)}

          </div>


          <div>

            <div class="match-score">

              ${scoreText}

            </div>


            <div class="match-time">

              ${escapeHTML(time)}

            </div>

          </div>


          <div class="match-team">

            ${
              awayLogo
              ?
              `<img
                src="${escapeHTML(awayLogo)}"
                alt=""
                onerror="this.style.display='none'"
              >`
              :
              "⚽"
            }

            ${escapeHTML(awayName)}

          </div>


        </div>

      `;


      item.onclick =
        () => openMatch(
          match.id
        );


      container.appendChild(
        item
      );

    }
  );

}


/* =========================================
   STATUS
========================================= */

function getStatusInfo(
  status
) {

  switch(status) {

    case "IN_PLAY":

      return {
        text: "LIVE",
        className: "status"
      };


    case "PAUSED":

      return {
        text: "نیمه",
        className: "status"
      };


    case "FINISHED":

      return {
        text: "پایان",
        className: "status finished"
      };


    case "POSTPONED":

      return {
        text: "لغو/تعویق",
        className: "status finished"
      };


    case "TIMED":

      return {
        text: "آینده",
        className: "status upcoming"
      };


    default:

      return {
        text: status,
        className: "status"
      };

  }

}


/* =========================================
   MATCH TIME
========================================= */

function formatTime(
  utcDate
) {

  if (!utcDate) {

    return "--:--";

  }


  const date =
    new Date(
      utcDate
    );


  return date.toLocaleTimeString(
    "fa-IR",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =========================================
   LIVE MINUTE
========================================= */

function getMatchMinute(
  match
) {

  if (
    match.status === "PAUSED"
  ) {

    return "نیمه اول/دوم";

  }


  if (
    match.minute !== undefined &&
    match.minute !== null
  ) {

    return `${match.minute}'`;

  }


  return "در حال بازی";

}


/* =========================================
   OPEN MATCH
========================================= */

function openMatch(
  id
) {

  window.location.href =
    "match.html?id=" +
    encodeURIComponent(
      id
    );

}


/* =========================================
   LOAD NEWS
========================================= */

async function loadNews() {

  const container =
    document.getElementById(
      "newsContainer"
    );


  try {

    const response =
      await fetch(
        "./api/news.json?time=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "news.json پیدا نشد"
      );

    }


    const data =
      await response.json();


    if (
      !data.success ||
      !Array.isArray(data.news)
    ) {

      throw new Error(
        "ساختار news.json صحیح نیست"
      );

    }


    container.innerHTML = "";


    if (
      data.news.length === 0
    ) {

      container.innerHTML = `

        <div class="empty">

          📰 خبری موجود نیست.

        </div>

      `;

      return;

    }


    data.news.forEach(
      news => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "news";


        item.innerHTML = `

          <div class="news-icon">

            📰

          </div>


          <div class="news-content">


            <div class="news-title">

              ${escapeHTML(
                news.title
              )}

            </div>


            <div class="news-description">

              ${escapeHTML(
                news.description
              )}

            </div>


            <div class="news-category">

              ${escapeHTML(
                news.category
              )}

            </div>


          </div>

        `;


        container.appendChild(
          item
        );

      }
    );


  } catch(error) {

    console.error(
      "News Error:",
      error
    );


    container.innerHTML = `

      <div class="error">

        ❌ دریافت اخبار با مشکل مواجه شد.

        <br><br>

        مسیر:

        api/news.json

      </div>

    `;

  }

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(
  value
) {

  if (
    value === undefined ||
    value === null
  ) {

    return "";

  }


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(value);


  return div.innerHTML;

}


/* =========================================
   NOTIFICATION
========================================= */

function showNotification() {

  alert(
    "🔔 اعلان‌های football_live به‌زودی فعال می‌شوند."
  );

}


/* =========================================
   NAVIGATION
========================================= */

function goHome() {

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function scrollToLive() {

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function showMatches() {

  const section =
    document.getElementById(
      "matchesSection"
    );


  if (section) {

    section.scrollIntoView({
      behavior: "smooth"
    });

  }

}


function scrollToNews() {

  const section =
    document.getElementById(
      "newsSection"
    );


  if (section) {

    section.scrollIntoView({
      behavior: "smooth"
    });

  }

}


/* =========================================
   START
========================================= */

loadMatches();

loadNews();


/* =========================================
   AUTO REFRESH
========================================= */

setInterval(
  loadMatches,
  60000
);

</script>

</body>

</html>
