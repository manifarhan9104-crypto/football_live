<!DOCTYPE html>

<title>football_live</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#080d12;
color:white;
min-height:100vh;
}

.app{
max-width:650px;
margin:auto;
padding-bottom:90px;
}

header{
padding:18px 16px;
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:48px;
height:48px;
border-radius:15px;
background:#00d26a;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}

.brand h1{
font-size:20px;
}

.brand p{
font-size:11px;
color:#7d8b97;
margin-top:4px;
}

.notification{
width:42px;
height:42px;
border-radius:13px;
background:#121a22;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}

.section{
padding:0 16px;
margin-top:10px;
}

.section-title{
font-size:18px;
font-weight:bold;
margin-bottom:13px;
}

.live-card{
background:linear-gradient(145deg,#10251a,#10171d);
border:1px solid rgba(0,210,106,.35);
border-radius:24px;
padding:20px;
}

.live-label{
width:max-content;
margin:auto;
background:rgba(255,50,50,.12);
color:#ff5252;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.league{
text-align:center;
color:#7d8b97;
font-size:12px;
margin-top:14px;
}

.teams{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
gap:12px;
margin-top:18px;
}

.team{
text-align:center;
}

.team-logo{
width:58px;
height:58px;
border-radius:50%;
background:#1c2730;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:28px;
}

.team-name{
font-size:14px;
font-weight:bold;
margin-top:8px;
}

.score{
font-size:30px;
font-weight:bold;
direction:ltr;
}

.minute{
text-align:center;
color:#00d26a;
font-weight:bold;
font-size:13px;
margin-top:5px;
}

.details-btn{
width:100%;
border:none;
background:#00d26a;
color:#06100b;
font-weight:bold;
padding:14px;
border-radius:14px;
margin-top:20px;
cursor:pointer;
font-size:14px;
}

.match{
background:#121a22;
border-radius:18px;
padding:16px;
margin-bottom:10px;
}

.match-top{
display:flex;
justify-content:space-between;
font-size:11px;
color:#7d8b97;
}

.status{
color:#00d26a;
}

.match-teams{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
text-align:center;
margin-top:14px;
}

.match-score{
font-size:19px;
font-weight:bold;
direction:ltr;
}

.match-time{
font-size:11px;
color:#7d8b97;
margin-top:5px;
}

.news{
background:#121a22;
border-radius:18px;
padding:15px;
margin-bottom:10px;
display:flex;
gap:13px;
cursor:pointer;
}

.news-icon{
width:65px;
height:65px;
border-radius:14px;
background:#1c2730;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
flex-shrink:0;
}

.news-content{
flex:1;
}

.news-title{
font-size:14px;
font-weight:bold;
line-height:1.6;
}

.news-description{
font-size:11px;
color:#7d8b97;
line-height:1.7;
margin-top:5px;
}

.news-category{
font-size:10px;
color:#00d26a;
margin-top:7px;
}

.loading{
text-align:center;
color:#7d8b97;
padding:20px;
}

.error{
background:#301719;
color:#ff7777;
padding:15px;
border-radius:14px;
font-size:12px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(650px,100%);
height:75px;
background:#10171d;
border-top:1px solid #1d2730;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:20;
}

.nav-item{
border:none;
background:transparent;
color:#7d8b97;
cursor:pointer;
font-size:11px;
}

.nav-item span{
display:block;
font-size:22px;
margin-bottom:4px;
}

.nav-item.active{
color:#00d26a;
}

</style>

</head>

<script>


async function loadNews() {

  const container = document.getElementById("newsContainer");

  try {

    const response = await fetch("./api/news.json");

    if (!response.ok) {
      throw new Error("خطا در دریافت news.json");
    }

    const data = await response.json();

    if (!data.success || !Array.isArray(data.news)) {
      throw new Error("ساختار news.json صحیح نیست");
    }

    container.innerHTML = "";

    data.news.forEach(news => {

      const item = document.createElement("div");

      item.className = "news";

      item.innerHTML = `
        <div class="news-icon">
          📰
        </div>

        <div class="news-content">

          <div class="news-title">
            ${news.title}
          </div>

          <div class="news-description">
            ${news.description}
          </div>

          <div class="news-category">
            ${news.category}
          </div>

        </div>
      `;

      container.appendChild(item);

    });

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="error">
        ❌ اخبار بارگذاری نشد.
      </div>
    `;

  }

}

loadNews();

const response =
await fetch(

);

){

</div>
`;

return;

}


data.news.forEach(
news => {

const item =
document.createElement(
"div"
);

item.className="news";


item.innerHTML=`

<div class="news-icon">

<div class="news-content">

</div>

${news.description}
</div>

<div class="news-category">
${news.category}
</div>

</div>

`;


container.appendChild(item);

});


}catch(error){

container.innerHTML=`

<div class="error">

❌ دریافت اخبار با مشکل مواجه شد.

</div>

}

}


loadNews();
