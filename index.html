<body>

<div class="app">

  <header>
    <h1>⚽ football_live</h1>
    <p>نتایج زنده و لحظه‌ای فوتبال</p>
  </header>

  <div class="top-info">
    امروز <strong id="matchCount">0</strong> بازی در اطلاعات موجود است
  </div>

  <section class="section">

    <div class="section-title">
      🔴 بازی‌های زنده
    </div>

    <div id="liveMatches" class="matches">

      <div class="loading">
        <div class="spinner"></div>
        در حال دریافت بازی‌ها...
      </div>

    </div>

  </section>

  <section class="section">

    <div class="section-title">
      📅 سایر بازی‌ها
    </div>

    <div id="otherMatches" class="matches"></div>

  </section>

</div>


<nav class="bottom-nav">

  <button class="nav-item active">
    <span>🏠</span>
    خانه
  </button>

  <button class="nav-item" onclick="scrollToLive()">
    <span>⚽</span>
    زنده
  </button>

  <button class="nav-item" onclick="scrollToOther()">
    <span>📅</span>
    بازی‌ها
  </button>

  <button
  class="nav-item"
  onclick="window.location.href='news.html'">

  <span>📰</span>
  اخبار

</button>

</nav>


<script>

const API_URL = "./api/matches.json";


function escapeHTML(value) {

  if (value === undefined || value === null) {
    return "";
  }

  const div = document.createElement("div");

  div.textContent = String(value);

  return div.innerHTML;
}


function getStatus(status) {

  switch (status) {

    case "IN_PLAY":
      return {
        text: "🔴 LIVE",
        className: "live"
      };

    case "PAUSED":
      return {
        text: "⏸ نیمه",
        className: "live"
      };

    case "FINISHED":
      return {
        text: "پایان",
        className: "finished"
      };

    case "TIMED":
      return {
        text: "بازی آینده",
        className: "upcoming"
      };

    case "SCHEDULED":
      return {
        text: "برنامه‌ریزی شده",
        className: "upcoming"
      };

    case "POSTPONED":
      return {
        text: "به تعویق افتاده",
        className: "postponed"
      };

    case "CANCELLED":
      return {
        text: "لغو شده",
        className: "postponed"
      };

    default:
      return {
        text: status || "نامشخص",
        className: "finished"
      };
  }

}


function createLogo(url) {

  if (!url) {
    return "⚽";
  }

  return `
    <img
      src="${escapeHTML(url)}"
      alt="لوگو"
      onerror="this.style.display='none'; this.parentElement.innerHTML='⚽';"
    >
  `;
}


function createMatchCard(match) {

  const status = getStatus(match.status);

  const homeScore =
    match.homeScore === null ||
    match.homeScore === undefined
      ? "-"
      : match.homeScore;

  const awayScore =
    match.awayScore === null ||
    match.awayScore === undefined
      ? "-"
      : match.awayScore;


  let timeText = "";

  if (
    match.status === "IN_PLAY" ||
    match.status === "PAUSED"
  ) {

    timeText =
      match.minute !== null &&
      match.minute !== undefined
        ? `${escapeHTML(match.minute)}'`
        : "زنده";

  } else {

    timeText =
      escapeHTML(match.time || "-");

  }


  return `

    <div
      class="match-card"
      onclick="openMatch('${escapeHTML(match.id)}')"
    >

      <div class="match-top">

        <div class="league">
          ${escapeHTML(match.league || "لیگ نامشخص")}
        </div>

        <div class="status ${status.className}">
          ${status.text}
        </div>

      </div>


      <div class="teams">

        <div class="team">

          <div class="logo">
            ${createLogo(match.homeLogo)}
          </div>

          <div class="team-name">
            ${escapeHTML(match.homeTeam)}
          </div>

        </div>


        <div>

          <div class="score">
            ${escapeHTML(homeScore)}
            -
            ${escapeHTML(awayScore)}
          </div>

          <div class="time">
            ${timeText}
          </div>

        </div>


        <div class="team">

          <div class="logo">
            ${createLogo(match.awayLogo)}
          </div>

          <div class="team-name">
            ${escapeHTML(match.awayTeam)}
          </div>

        </div>

      </div>

    </div>

  `;

}


function openMatch(id) {

  if (!id) {
    return;
  }

  window.location.href =
    "match.html?id=" +
    encodeURIComponent(id);

}


async function loadMatches() {

  const liveContainer =
    document.getElementById("liveMatches");

  const otherContainer =
    document.getElementById("otherMatches");

  try {

    const response =
      await fetch(
        API_URL + "?t=" + Date.now()
      );

    if (!response.ok) {

      throw new Error(
        "matches.json پیدا نشد"
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !Array.isArray(data.matches)
    ) {

      throw new Error(
        "ساختار matches.json صحیح نیست"
      );

    }


    const matches =
      data.matches;


    document.getElementById("matchCount")
      .textContent = matches.length;


    const liveMatches =
      matches.filter(match =>
        match.status === "IN_PLAY" ||
        match.status === "PAUSED"
      );


    const otherMatches =
      matches.filter(match =>
        match.status !== "IN_PLAY" &&
        match.status !== "PAUSED"
      );


    if (liveMatches.length > 0) {

      liveContainer.innerHTML =
        liveMatches
          .map(createMatchCard)
          .join("");

    } else {

      liveContainer.innerHTML = `

        <div class="empty">
          در حال حاضر بازی زنده‌ای وجود ندارد.
        </div>

      `;

    }


    if (otherMatches.length > 0) {

      otherContainer.innerHTML =
        otherMatches
          .map(createMatchCard)
          .join("");

    } else {

      otherContainer.innerHTML = `

        <div class="empty">
          بازی دیگری پیدا نشد.
        </div>

      `;

    }


  } catch (error) {

    console.error(error);


    liveContainer.innerHTML = `

      <div class="error">

        ❌ دریافت بازی‌ها با مشکل مواجه شد.

        <br>

        ${escapeHTML(error.message)}

        <br>

        <button
          class="retry"
          onclick="loadMatches()"
        >
          تلاش دوباره
        </button>

      </div>

    `;


    otherContainer.innerHTML = "";

  }

}


function scrollToLive() {

  document
    .getElementById("liveMatches")
    .scrollIntoView({
      behavior: "smooth"
    });

}


function scrollToOther() {

  document
    .getElementById("otherMatches")
    .scrollIntoView({
      behavior: "smooth"
    });

}


loadMatches();


/*
  هر 30 ثانیه اطلاعات بازی‌ها دوباره دریافت می‌شود
*/

setInterval(
  loadMatches,
  30000
);

</script>

</body>
</html>
